<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Kcal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1c1c1c;
    --border: #2a2a2a;
    --text: #e8e4dc;
    --text-muted: #666;
    --text-dim: #444;
    --accent: #c8f060;
    --accent-dim: #8aab35;
    --danger: #ff6b6b;
    --warn: #f0a060;
    --desayuno: #7eb8f7;
    --almuerzo: #f7c97e;
    --cena: #c47ef7;
    --snacks: #7ef7b8;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overscroll-behavior: none;
    padding-bottom: 80px;
  }

  /* HEADER */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 12px;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }

  .app-title {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: -0.5px;
    color: var(--text);
    line-height: 1;
  }

  .app-title span {
    color: var(--accent);
    font-style: italic;
  }

  .date-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    text-align: right;
    line-height: 1.6;
  }

  /* PROGRESS BAR */
  .progress-wrap {
    position: relative;
  }

  .progress-nums {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .kcal-current {
    font-family: 'Fraunces', serif;
    font-size: 36px;
    font-weight: 600;
    letter-spacing: -1px;
    line-height: 1;
    transition: color 0.3s;
  }

  .kcal-goal {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  .progress-bar-bg {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--accent);
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s;
    max-width: 100%;
  }

  .progress-bar-fill.warn { background: var(--warn); }
  .progress-bar-fill.over { background: var(--danger); }

  .remaining {
    margin-top: 6px;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  /* NAV TABS */
  .nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: rgba(10,10,10,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  }

  .nav-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: color 0.2s;
  }

  .nav-btn.active { color: var(--accent); }
  .nav-btn svg { opacity: 0.8; }

  /* PAGES */
  .page { display: none; padding: 20px; }
  .page.active { display: block; }

  /* SECTION CARDS */
  .section-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }

  .section-title-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .section-name {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text);
  }

  .section-kcal {
    font-size: 13px;
    color: var(--text-muted);
  }

  .section-body {
    display: none;
    border-top: 1px solid var(--border);
  }

  .section-body.open { display: block; }

  .food-list { padding: 0; }

  .food-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    animation: slideIn 0.2s ease;
  }

  .food-item:last-child { border-bottom: none; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .food-info { flex: 1; }
  .food-name { font-size: 13px; color: var(--text); }
  .food-meta { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

  .food-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .food-kcal {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 300;
    color: var(--text);
  }

  .del-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 4px;
    font-size: 16px;
    line-height: 1;
    transition: color 0.2s;
  }

  .del-btn:hover { color: var(--danger); }

  /* ADD FORM */
  .add-form {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-top: 1px solid var(--border);
  }

  .input-row {
    display: flex;
    gap: 8px;
  }

  .input-field {
    flex: 1;
    min-width: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 10px 10px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
    width: 100%;
  }

  .input-field::placeholder { color: var(--text-dim); }
  .input-field:focus { border-color: var(--accent-dim); }

  .input-field.small {
    flex: 0 0 72px;
    min-width: 0;
  }

  .add-btn {
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    padding: 10px 14px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    flex-shrink: 0;
    line-height: 1;
  }

  .add-btn:active { transform: scale(0.97); opacity: 0.85; }

  /* CALENDAR PAGE */
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .cal-nav-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
  }

  .cal-month {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 300;
    text-transform: capitalize;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    margin-bottom: 20px;
  }

  .cal-day-label {
    font-size: 9px;
    color: var(--text-muted);
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 4px 0;
  }

  .cal-day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
    gap: 2px;
  }

  .cal-day:empty { cursor: default; }
  .cal-day.empty { cursor: default; }

  .cal-day-num {
    font-size: 13px;
    line-height: 1;
  }

  .cal-day-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent-dim);
  }

  .cal-day.has-data { background: var(--surface); }
  .cal-day.today { border: 1px solid var(--accent-dim); }
  .cal-day.selected { background: var(--accent) !important; }
  .cal-day.selected .cal-day-num { color: #0a0a0a; }
  .cal-day.selected .cal-day-dot { background: #0a0a0a; }

  /* DAY DETAIL */
  .day-detail {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: none;
  }

  .day-detail.visible { display: block; }

  .day-detail-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }

  .day-detail-date {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 300;
  }

  .day-detail-total {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--accent);
  }

  .day-section {
    margin-bottom: 12px;
  }

  .day-section-title {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .day-section-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  .day-food-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }

  .day-food-row:last-child { border-bottom: none; }

  .day-food-name { color: var(--text); }
  .day-food-sub { color: var(--text-muted); font-size: 10px; }
  .day-food-kcal { color: var(--text); }

  .no-data { color: var(--text-dim); font-size: 12px; text-align: center; padding: 20px; }

  /* SETTINGS PAGE */
  .settings-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }

  .settings-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 12px;
    display: block;
  }

  .settings-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .settings-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 300;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  .settings-input:focus { border-color: var(--accent-dim); }

  .save-btn {
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 12px 20px;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .save-btn:active { opacity: 0.8; }

  .hint {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 10px;
    line-height: 1.6;
  }

  /* MACROS BAR */
  .macros-wrap {
    margin-top: 8px;
  }

  .macro-bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .macro-label {
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    width: 60px;
    flex-shrink: 0;
  }

  .macro-track {
    flex: 1;
    height: 3px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .macro-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: #0a0a0a;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    padding: 10px 20px;
    border-radius: 100px;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 999;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* UTILS */
  .page-title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 300;
    margin-bottom: 20px;
  }

  .empty-state {
    text-align: center;
    padding: 30px 20px;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 2;
  }

  .empty-state span {
    display: block;
    font-family: 'Fraunces', serif;
    font-size: 32px;
    margin-bottom: 8px;
    opacity: 0.3;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div>
      <div class="app-title">k<span>cal</span></div>
    </div>
    <div class="date-label" id="headerDate"></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-nums">
      <div class="kcal-current" id="kcalCurrent">0</div>
      <div class="kcal-goal" id="kcalGoalLabel">/ 1700 kcal</div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="remaining" id="remainingLabel"></div>
  </div>
</div>

<!-- PAGE: HOY -->
<div class="page active" id="pageToday">
  <div id="sectionsContainer"></div>
</div>

<!-- PAGE: CALENDARIO -->
<div class="page" id="pageCalendar">
  <div class="cal-header">
    <button class="cal-nav-btn" id="calPrev">‹</button>
    <div class="cal-month" id="calMonthLabel"></div>
    <button class="cal-nav-btn" id="calNext">›</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>
  <div class="day-detail" id="dayDetail"></div>
</div>

<!-- PAGE: AJUSTES -->
<div class="page" id="pageSettings">
  <div class="settings-section">
    <span class="settings-label">Objetivo calórico diario</span>
    <div class="settings-row">
      <input type="number" class="settings-input" id="goalInput" placeholder="1700">
      <button class="save-btn" id="saveGoalBtn">Guardar</button>
    </div>
    <p class="hint">Tu TDEE estimado aparecerá en la barra de progreso. Puedes ajustar según tu déficit o superávit deseado.</p>
  </div>
  <div class="settings-section">
    <span class="settings-label">Datos de hoy</span>
    <button class="save-btn" id="clearTodayBtn" style="background:var(--surface2);color:var(--danger);border:1px solid var(--danger);">
      Borrar entradas de hoy
    </button>
  </div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nav-btn active" id="navToday" onclick="showPage('today')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
    Hoy
  </button>
  <button class="nav-btn" id="navCalendar" onclick="showPage('calendar')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Historial
  </button>
  <button class="nav-btn" id="navSettings" onclick="showPage('settings')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Ajustes
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
// ─── CONSTANTS ───────────────────────────────────────────
const CATEGORIES = [
  { id: 'desayuno', name: 'Desayuno', color: 'var(--desayuno)', emoji: '☕' },
  { id: 'almuerzo', name: 'Almuerzo', color: 'var(--almuerzo)', emoji: '🍽️' },
  { id: 'cena',     name: 'Cena',     color: 'var(--cena)',     emoji: '🌙' },
  { id: 'snacks',   name: 'Snacks',   color: 'var(--snacks)',   emoji: '🍎' },
];

const STORAGE_KEY = 'kcal_data_v1';
const GOAL_KEY    = 'kcal_goal_v1';

// ─── STATE ───────────────────────────────────────────────
let state = loadAll();
let goal  = parseInt(localStorage.getItem(GOAL_KEY) || '1700');
let calViewDate = new Date();
let openSections = {};

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function loadAll() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}

function saveAll() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getDayData(key) {
  return state[key] || { desayuno: [], almuerzo: [], cena: [], snacks: [] };
}

function getTotalKcal(dayData) {
  return CATEGORIES.reduce((sum, c) => {
    return sum + (dayData[c.id] || []).reduce((s, f) => s + f.kcal, 0);
  }, 0);
}

// ─── HEADER ──────────────────────────────────────────────
function updateHeader() {
  const today = todayKey();
  const d = new Date();
  const days = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  document.getElementById('headerDate').innerHTML =
    `${days[d.getDay()]}<br>${d.getDate()} ${months[d.getMonth()]}`;

  const data = getDayData(today);
  const total = getTotalKcal(data);
  const pct = Math.min(total / goal, 1);
  const remaining = goal - total;

  document.getElementById('kcalCurrent').textContent = total;
  document.getElementById('kcalGoalLabel').textContent = `/ ${goal} kcal`;

  const fill = document.getElementById('progressFill');
  fill.style.width = (pct * 100) + '%';
  fill.className = 'progress-bar-fill' + (pct >= 1 ? ' over' : pct >= 0.85 ? ' warn' : '');

  const currentEl = document.getElementById('kcalCurrent');
  currentEl.style.color = pct >= 1 ? 'var(--danger)' : pct >= 0.85 ? 'var(--warn)' : 'var(--text)';

  const remEl = document.getElementById('remainingLabel');
  if (remaining > 0) {
    remEl.textContent = `${remaining} kcal restantes`;
    remEl.style.color = 'var(--text-muted)';
  } else if (remaining === 0) {
    remEl.textContent = '¡Objetivo alcanzado!';
    remEl.style.color = 'var(--accent)';
  } else {
    remEl.textContent = `+${Math.abs(remaining)} kcal sobre el objetivo`;
    remEl.style.color = 'var(--danger)';
  }
}

// ─── TODAY PAGE ───────────────────────────────────────────
function renderToday() {
  const today = todayKey();
  const data = getDayData(today);
  const container = document.getElementById('sectionsContainer');
  container.innerHTML = '';

  let anyFood = false;
  CATEGORIES.forEach(cat => {
    const items = data[cat.id] || [];
    if (items.length > 0) anyFood = true;
    const catTotal = items.reduce((s, f) => s + f.kcal, 0);
    const isOpen = openSections[cat.id] !== false;

    const card = document.createElement('div');
    card.className = 'section-card';
    card.innerHTML = `
      <div class="section-header" onclick="toggleSection('${cat.id}')">
        <div class="section-title-wrap">
          <div class="section-dot" style="background:${cat.color}"></div>
          <span class="section-name">${cat.name}</span>
        </div>
        <span class="section-kcal">${catTotal > 0 ? catTotal + ' kcal' : ''}</span>
      </div>
      <div class="section-body ${isOpen ? 'open' : ''}" id="body-${cat.id}">
        <div class="food-list" id="list-${cat.id}">
          ${items.length === 0 ? '<div class="no-data">Sin entradas aún</div>' : ''}
          ${items.map((f, i) => `
            <div class="food-item">
              <div class="food-info">
                <div class="food-name">${f.name}</div>
                <div class="food-meta">${f.grams ? f.grams + 'g' : ''}</div>
              </div>
              <div class="food-right">
                <span class="food-kcal">${f.kcal}</span>
                <button class="del-btn" onclick="deleteFood('${cat.id}', ${i})">×</button>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="add-form">
          <div class="input-row">
            <input type="text" class="input-field" id="name-${cat.id}" placeholder="Alimento…" autocomplete="off">
          </div>
          <div class="input-row" style="align-items:stretch;">
            <input type="number" class="input-field small" id="grams-${cat.id}" placeholder="gramos" inputmode="decimal" style="flex:0 0 76px;">
            <input type="number" class="input-field" id="kcal-${cat.id}" placeholder="kcal" inputmode="decimal" style="flex:1;">
            <button class="add-btn" onclick="addFood('${cat.id}')" style="flex:0 0 42px;">+</button>
          </div>
        </div>
      </div>
    `;
    container.appendChild(card);
  });

  updateHeader();
}

function toggleSection(catId) {
  openSections[catId] = !openSections[catId];
  if (openSections[catId] === undefined) openSections[catId] = false;
  const body = document.getElementById(`body-${catId}`);
  if (body) body.classList.toggle('open', openSections[catId] !== false);
}

function addFood(catId) {
  const nameEl  = document.getElementById(`name-${catId}`);
  const gramsEl = document.getElementById(`grams-${catId}`);
  const kcalEl  = document.getElementById(`kcal-${catId}`);

  const name  = nameEl.value.trim();
  const grams = gramsEl.value ? parseFloat(gramsEl.value) : null;
  const kcal  = parseInt(kcalEl.value);

  if (!name || isNaN(kcal) || kcal <= 0) {
    showToast('Ingresa nombre y calorías');
    return;
  }

  const today = todayKey();
  if (!state[today]) state[today] = { desayuno: [], almuerzo: [], cena: [], snacks: [] };
  state[today][catId].push({ name, grams, kcal });
  saveAll();

  nameEl.value = '';
  gramsEl.value = '';
  kcalEl.value = '';
  openSections[catId] = true;

  renderToday();
  showToast(`+${kcal} kcal añadidas`);
}

function deleteFood(catId, index) {
  const today = todayKey();
  if (state[today] && state[today][catId]) {
    state[today][catId].splice(index, 1);
    saveAll();
    renderToday();
  }
}

// ─── CALENDAR ────────────────────────────────────────────
let selectedCalDay = null;

function renderCalendar() {
  const year  = calViewDate.getFullYear();
  const month = calViewDate.getMonth();

  const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                  'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  document.getElementById('calMonthLabel').textContent = `${months[month]} ${year}`;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const dayLabels = ['D','L','M','X','J','V','S'];
  dayLabels.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-day-label';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = todayKey();

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasData = !!state[key] && getTotalKcal(getDayData(key)) > 0;
    const isToday = key === today;
    const isSelected = key === selectedCalDay;

    const el = document.createElement('div');
    el.className = `cal-day${hasData ? ' has-data' : ''}${isToday ? ' today' : ''}${isSelected ? ' selected' : ''}`;
    el.innerHTML = `<span class="cal-day-num">${d}</span>${hasData ? '<div class="cal-day-dot"></div>' : ''}`;
    el.addEventListener('click', () => selectCalDay(key));
    grid.appendChild(el);
  }

  if (selectedCalDay) renderDayDetail(selectedCalDay);
}

function selectCalDay(key) {
  selectedCalDay = key;
  renderCalendar();
  renderDayDetail(key);
}

function renderDayDetail(key) {
  const detail = document.getElementById('dayDetail');
  const data   = getDayData(key);
  const total  = getTotalKcal(data);

  const [year, month, day] = key.split('-');
  const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const dateLabel = `${parseInt(day)} ${months[parseInt(month)-1]} ${year}`;

  let html = `
    <div class="day-detail-header">
      <div class="day-detail-date">${dateLabel}</div>
      <div class="day-detail-total">${total} <span style="font-size:14px;color:var(--text-muted)">kcal</span></div>
    </div>
  `;

  if (total === 0) {
    html += `<div class="no-data">Sin registros este día</div>`;
  } else {
    CATEGORIES.forEach(cat => {
      const items = data[cat.id] || [];
      if (items.length === 0) return;
      const catTotal = items.reduce((s, f) => s + f.kcal, 0);
      html += `
        <div class="day-section">
          <div class="day-section-title">
            <div class="day-section-dot" style="background:${cat.color}"></div>
            ${cat.name} · ${catTotal} kcal
          </div>
          ${items.map(f => `
            <div class="day-food-row">
              <div>
                <div class="day-food-name">${f.name}</div>
                ${f.grams ? `<div class="day-food-sub">${f.grams}g</div>` : ''}
              </div>
              <div class="day-food-kcal">${f.kcal} kcal</div>
            </div>
          `).join('')}
        </div>
      `;
    });
  }

  const pct = goal > 0 ? Math.min(total / goal, 1) : 0;
  html += `
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
      <div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;display:flex;justify-content:space-between;">
        <span>vs objetivo</span><span>${goal} kcal</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill ${pct>=1?'over':pct>=0.85?'warn':''}" style="width:${pct*100}%"></div>
      </div>
    </div>
  `;

  detail.innerHTML = html;
  detail.classList.add('visible');
  setTimeout(() => detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
}

document.getElementById('calPrev').addEventListener('click', () => {
  calViewDate.setMonth(calViewDate.getMonth() - 1);
  selectedCalDay = null;
  document.getElementById('dayDetail').classList.remove('visible');
  renderCalendar();
});

document.getElementById('calNext').addEventListener('click', () => {
  calViewDate.setMonth(calViewDate.getMonth() + 1);
  selectedCalDay = null;
  document.getElementById('dayDetail').classList.remove('visible');
  renderCalendar();
});

// ─── SETTINGS ────────────────────────────────────────────
document.getElementById('goalInput').value = goal;

document.getElementById('saveGoalBtn').addEventListener('click', () => {
  const val = parseInt(document.getElementById('goalInput').value);
  if (!isNaN(val) && val > 0) {
    goal = val;
    localStorage.setItem(GOAL_KEY, val);
    updateHeader();
    showToast('Objetivo guardado');
  } else {
    showToast('Ingresa un valor válido');
  }
});

document.getElementById('clearTodayBtn').addEventListener('click', () => {
  if (confirm('¿Borrar todas las entradas de hoy?')) {
    const today = todayKey();
    delete state[today];
    saveAll();
    renderToday();
    showToast('Entradas borradas');
  }
});

// ─── NAVIGATION ───────────────────────────────────────────
function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

  if (page === 'today') {
    document.getElementById('pageToday').classList.add('active');
    document.getElementById('navToday').classList.add('active');
    renderToday();
  } else if (page === 'calendar') {
    document.getElementById('pageCalendar').classList.add('active');
    document.getElementById('navCalendar').classList.add('active');
    renderCalendar();
  } else if (page === 'settings') {
    document.getElementById('pageSettings').classList.add('active');
    document.getElementById('navSettings').classList.add('active');
  }
}

// ─── TOAST ───────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

// ─── ENTER KEY ────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const focused = document.activeElement;
    CATEGORIES.forEach(cat => {
      if (focused && focused.id && focused.id.endsWith(cat.id)) {
        addFood(cat.id);
      }
    });
  }
});

// ─── INIT ─────────────────────────────────────────────────
CATEGORIES.forEach(c => { openSections[c.id] = true; });
renderToday();
</script>
</body>
</html>
